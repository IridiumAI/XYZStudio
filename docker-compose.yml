name: xyzstudio

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/server/dist/index.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/data
      WEB_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "apps/server/dist/worker.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    profiles: ["full"]

volumes:
  redis-data:
  app-data:
